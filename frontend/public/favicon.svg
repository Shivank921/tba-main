<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-label="The Bengali Association, Coimbatore">
  <defs>
    <path id="tbaArcTop" d="M 50,256 A 206,206 0 0 1 462,256" />
    <path id="tbaArcBottom" d="M 48,256 A 208,208 0 0 0 464,256" />
  </defs>

  <!-- Outer seal -->
  <circle cx="256" cy="256" r="246" fill="#ffffff" stroke="#000000" stroke-width="13" />
  <circle cx="256" cy="256" r="194" fill="none" stroke="#000000" stroke-width="6" />

  <!-- Curved lettering -->
  <text font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="42" letter-spacing="1" fill="#000000">
    <textPath xlink:href="#tbaArcTop" href="#tbaArcTop" startOffset="50%" text-anchor="middle">THE BENGALI ASSOCIATION</textPath>
  </text>
  <text font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="34" letter-spacing="0.5" fill="#000000">
    <textPath xlink:href="#tbaArcBottom" href="#tbaArcBottom" startOffset="50%" text-anchor="middle">COIMBATORE</textPath>
  </text>

  <!-- Triangle -->
  <path d="M 256,156 L 384,366 L 128,366 Z" fill="none" stroke="#000000" stroke-width="7" stroke-linejoin="miter" />
  <path d="M 256,170 L 371,359 L 141,359 Z" fill="none" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />

  <!-- Peace / Prayer -->
  <text x="205.3" y="268.7" transform="rotate(-60 205.3 268.7)" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="24" letter-spacing="1.5" fill="#000000">PEACE</text>
  <text x="306.7" y="268.7" transform="rotate(60 306.7 268.7)" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="24" letter-spacing="1.5" fill="#000000">PRAYER</text>

  <!-- TBA monogram -->
  <text x="256" y="250" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="58" fill="#000000">T</text>
  <text x="256" y="302" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="44" fill="#000000">B</text>
  <text x="256" y="350" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="44" fill="#000000">A</text>

  <!-- Service / registration -->
  <text x="256" y="398" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="30" letter-spacing="3" fill="#000000">SERVICE</text>
  <text x="256" y="430" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="19" letter-spacing="0.5" fill="#000000">REGD NO: 189/2002</text>
</svg>
